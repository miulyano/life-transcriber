<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <title>Транскрибатор</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font: 16px system-ui, -apple-system, sans-serif;
      padding: 16px 20px 24px;
      margin: 0;
      background: var(--tg-theme-bg-color, #fff);
      color: var(--tg-theme-text-color, #000);
    }
    h2 {
      margin: 0 0 20px;
      font-size: 20px;
      font-weight: 600;
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    .tab {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 10px;
      background: var(--tg-theme-secondary-bg-color, #f0f0f0);
      color: var(--tg-theme-text-color, #000);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    .tab.active {
      background: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #fff);
    }
    .hint {
      font-size: 14px;
      color: var(--tg-theme-hint-color, #888);
      margin-bottom: 16px;
      line-height: 1.4;
    }
    input[type="file"] {
      display: block;
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border: 1.5px dashed var(--tg-theme-hint-color, #ccc);
      border-radius: 10px;
      background: var(--tg-theme-secondary-bg-color, #f5f5f5);
      color: var(--tg-theme-text-color, #000);
      font-size: 15px;
      cursor: pointer;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      font-size: 15px;
    }
    .toggle-row input { width: 18px; height: 18px; }
    button {
      display: block;
      width: 100%;
      padding: 14px;
      background: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #fff);
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button:disabled { opacity: 0.5; cursor: default; }
    #status {
      margin-top: 18px;
      font-size: 15px;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    #status.success { color: #27ae60; }
    #status.error { color: #e74c3c; }
    #progress {
      display: none;
      width: 100%;
      height: 10px;
      margin-top: 12px;
      border-radius: 6px;
      overflow: hidden;
      background: var(--tg-theme-secondary-bg-color, #eee);
    }
    #progress-bar {
      height: 100%;
      width: 0%;
      background: var(--tg-theme-button-color, #2481cc);
      transition: width 0.15s linear;
    }
    #transcripts { list-style: none; margin: 0; padding: 0; }
    .card {
      background: var(--tg-theme-secondary-bg-color, #f5f5f5);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 10px;
    }
    .card .title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 4px;
      word-break: break-word;
    }
    .card .channel {
      font-size: 13px;
      font-style: italic;
      color: var(--tg-theme-hint-color, #888);
      margin-bottom: 4px;
      word-break: break-word;
    }
    .card .meta {
      font-size: 13px;
      color: var(--tg-theme-hint-color, #888);
      margin-bottom: 10px;
    }
    .card .actions {
      display: flex;
      gap: 6px;
    }
    .card .actions button {
      flex: 1;
      width: auto;
      padding: 8px 6px;
      font-size: 13px;
      font-weight: 500;
      border-radius: 8px;
    }
    .card .actions .danger {
      background: transparent;
      border: 1px solid #e74c3c;
      color: #e74c3c;
      flex: 0 0 auto;
      padding: 8px 10px;
    }
    #list-status {
      font-size: 15px;
      color: var(--tg-theme-hint-color, #888);
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="tabs">
    <button class="tab active" id="tab-btn-upload">Загрузить</button>
    <button class="tab" id="tab-btn-list">Мои записи</button>
  </div>

  <section id="tab-upload">
    <h2>Загрузить аудио или видео</h2>
    <p class="hint">Выбери файл — он уйдёт на транскрибацию. Результат придёт прямо в чат бота.</p>
    <input type="file" id="file" accept="audio/*,video/*,.mp3,.m4a,.wav,.ogg,.mp4,.mov,.mkv,.webm">
    <label class="toggle-row">
      <input type="checkbox" id="timecodes" checked>
      Таймкоды в файле
    </label>
    <button id="upload">Отправить</button>
    <div id="progress"><div id="progress-bar"></div></div>
    <div id="status"></div>
  </section>

  <section id="tab-list" hidden>
    <h2>Мои записи</h2>
    <div id="list-status"></div>
    <ul id="transcripts"></ul>
  </section>

  <script src="app.js?v=1.12.1"></script>
</body>
</html>
